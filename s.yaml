edition: 3.0.0
name: fc-oj-judge
access: default

vars:
  region: cn-hangzhou
  # 修改为你的镜像仓库地址
  imageRegistry: registry.cn-hangzhou.aliyuncs.com
  imageNamespace: your-namespace

resources:
  judge:
    component: fc3
    props:
      region: ${vars.region}
      functionName: oj-judge
      description: "OJ 代码判题服务"
      runtime: custom-container
      cpu: 1
      memorySize: 2048
      diskSize: 512
      timeout: 60
      instanceConcurrency: 10
      
      customContainerConfig:
        image: ${vars.imageRegistry}/${vars.imageNamespace}/fc-oj-judge:latest
        port: 9000
        healthCheckConfig:
          httpGetUrl: /health
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
      
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            methods:
              - POST
              - GET
            authType: anonymous  # 改为 function 需要签名认证
