edition: 3.0.0
name: fc-oj-judge
access: default

vars:
  region: cn-hangzhou

resources:
  judge:
    component: fc3
    props:
      region: ${vars.region}
      functionName: oj-judge
      description: "OJ 代码判题服务"
      runtime: custom-container
      cpu: 1
      memorySize: 2048
      diskSize: 512
      timeout: 300
      instanceConcurrency: 10

      environmentVariables:
        JUDGE_TOKEN: ${env.JUDGE_TOKEN}

      customContainerConfig:
        image: crpi-qkw6eqij0k7hoglp.cn-hangzhou.personal.cr.aliyuncs.com/spy-service/fc-oj-judge:latest
        port: 9000
        healthCheckConfig:
          httpGetUrl: /health
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3

      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            methods:
              - POST
              - GET
            authType: anonymous
